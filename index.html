<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Premium Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary: #ff007f;
            --bg-color: #000000;
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: white;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
            transition: background-color 0.5s ease;
        }

        .bg-gradient-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.8) 100%);
            z-index: -1;
        }

        /* Floating Animation */
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }

        .premium-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: float 6s infinite ease-in-out;
            max-width: 90%;
            width: 450px;
        }

        .glow-text {
            text-shadow: 0 0 15px var(--primary);
        }

        #dynamic-img, #dynamic-gif {
            max-width: 150px;
            border-radius: 20px;
            margin: 0 auto 1.5rem;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .particle {
            position: absolute;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.3;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative">

    <div class="bg-gradient-overlay"></div>
    <div id="particles-container"></div>

    <main class="relative z-10 flex flex-col items-center">
        <!-- Dynamic Image/GIF Section -->
        <img id="dynamic-img" alt="Dynamic Content">
        <img id="dynamic-gif" alt="Dynamic GIF">

        <div class="premium-card p-10 text-center">
            <h1 id="user-name" class="text-5xl font-black mb-4 glow-text tracking-tighter"></h1>
            <p id="dynamic-msg" class="text-lg opacity-80 font-light mb-8 leading-relaxed"></p>
            
            <button onclick="startExperience()" id="cta-btn" class="px-8 py-3 rounded-full font-bold transition-all transform hover:scale-105 active:scale-95" style="background: var(--primary); box-shadow: 0 10px 20px -5px var(--primary);">
                Experience Shuru Korun
            </button>
        </div>
    </main>

    <!-- Hidden Audio -->
    <audio id="bgAudio" loop></audio>

    <script>
        // URL Parameters Extraction Logic
        const params = new URLSearchParams(window.location.search);
        
        // 1. Name Parameter
        const name = params.get("name") || "Guest";
        document.getElementById("user-name").innerText = `Hello, ${name}!`;
        document.getElementById("dynamic-msg").innerText = params.get("msg") || "Ei magical experience-ti shudhu apnar jonno toyari kora hoyeche.";

        // 2. Color Parameter
        const themeColor = params.get("color") ? `#${params.get("color")}` : "#ff007f";
        document.documentElement.style.setProperty('--primary', themeColor);
        
        // 3. Background Color Parameter
        const bgColor = params.get("bg") ? `#${params.get("bg")}` : "#050505";
        document.body.style.backgroundColor = bgColor;

        // 4. Image Parameter
        const imgUrl = params.get("img");
        if (imgUrl) {
            const imgEl = document.getElementById("dynamic-img");
            imgEl.src = imgUrl;
            imgEl.style.display = "block";
        }

        // 5. GIF Parameter
        const gifUrl = params.get("gif");
        if (gifUrl) {
            const gifEl = document.getElementById("dynamic-gif");
            gifEl.src = gifUrl;
            gifEl.style.display = "block";
        }

        // 6. Music Parameter
        const musicUrl = params.get("music") || "https://files.catbox.moe/udv967.mp3";
        const audio = document.getElementById("bgAudio");
        audio.src = musicUrl;

        // Particle System
        const container = document.getElementById('particles-container');
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 4 + 'px';
            p.style.width = size;
            p.style.height = size;
            p.style.left = Math.random() * 100 + 'vw';
            p.style.top = Math.random() * 100 + 'vh';
            p.style.animation = `float ${Math.random() * 10 + 5}s infinite ease-in-out`;
            container.appendChild(p);
        }

        let isPlaying = false;
        function startExperience() {
            if (!isPlaying) {
                audio.playbackRate = 4.0; // Shob shomoy 4x speed
                audio.play().then(() => {
                    isPlaying = true;
                    document.getElementById("cta-btn").innerText = "Enjoying Music...";
                    document.getElementById("cta-btn").style.opacity = "0.5";
                    document.getElementById("cta-btn").disabled = true;
                }).catch(e => console.log("Audio play error:", e));
            }
        }

        // Keep 4x speed even if looping
        audio.onplay = () => { audio.playbackRate = 4.0; };
    </script>
</body>
</html>
